<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App secrets demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; color: #1f2328; background: #f6f8fa; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { line-height: 1.5; }
    #greeting { font-family: ui-monospace, monospace; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 0.75rem 1rem; }
  </style>
</head>
<body>
  <h1>App secrets demo</h1>
  <p>The value below is read by the published app from its environment and is never in the source.</p>
  <p id="greeting">GREETING_SECRET: not set</p>
  <script>
    fetch("/api/greeting")
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (data && typeof data.GREETING_SECRET === "string") {
          document.getElementById("greeting").textContent = "GREETING_SECRET: " + data.GREETING_SECRET;
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
